ktor {
    application {
        modules = [ domain.ApplicationKt.module ]
    }
    
    server {
        host = "0.0.0.0"
        port = 8080
        watchPaths = [ "classes" ]
    }
}

database {
    url = "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL"
    driver = "org.h2.Driver"
    user = "sa"
    password = ""
    schema = "PUBLIC"
}

h2 {
    options {
        DB_CLOSE_DELAY = "-1"
        MODE = "MySQL"
    }
}

logging {
    level = "INFO"
    appenders {
        console {
            pattern = "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
        }
    }
}